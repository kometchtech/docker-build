name: Build and Push Multi-Arch Docker Images

on:
  push:
    branches:
      - master
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.alpha'
      - '**/VERSION.alpha'
      - '**/VERSION'
      - '**/entrypoint.sh'
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.alpha'
      - '**/VERSION.alpha'
      - '**/VERSION'
      - '**/entrypoint.sh'
  workflow_dispatch:
    inputs:
      directory:
        description: "Image directory (for example, pdnsrec)"
        required: true
        type: string
      variant:
        description: "Image variant"
        required: true
        type: choice
        options:
          - stable
          - alpha
      no-cache:
        description: "Build docker images with no cache"
        default: false
        required: false
        type: boolean

# Serialize publication and registry synchronization across master runs.
concurrency:
  group: docker-build-${{ github.ref }}
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      directories: ${{ steps.find-dirs.outputs.directories }}
      targets: ${{ steps.find-dirs.outputs.targets }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 全コミットを取得

      - name: Find build targets
        id: find-dirs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_COMMIT: ${{ github.event.before }}
          INPUT_DIRECTORY: ${{ inputs.directory }}
          INPUT_VARIANT: ${{ inputs.variant }}
        run: python3 .github/scripts/select-build-targets.py

  build:
    needs: prepare
    if: needs.prepare.outputs.targets != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: source

      - name: Get image name from directory
        id: image-name
        run: |
          IMAGE_NAME=$(basename ${{ matrix.target.directory }})
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Set VERSION environment variable
        id: set-version
        run: |
          VERSION_FILE="source/${{ matrix.target.directory }}/VERSION"
          if [ "${{ matrix.target.variant }}" = "alpha" ]; then VERSION_FILE="${VERSION_FILE}.alpha"; fi
          if [ -f "$VERSION_FILE" ]; then
            RELEASE_VERSION=$(cat "$VERSION_FILE" | tr -d ' \n\t\r')
            if [ -z "$RELEASE_VERSION" ] || { [ "${{ matrix.target.variant }}" = "alpha" ] && [ "$RELEASE_VERSION" = latest ]; }; then
              echo "Error: invalid version in $VERSION_FILE" >&2
              exit 1
            fi
            echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
            echo "Version set to: ${RELEASE_VERSION}"
          elif [ "${{ matrix.target.variant }}" = "alpha" ]; then
            echo "Error: VERSION.alpha is required for alpha builds" >&2
            exit 1
          else
            echo "No VERSION file found, using latest"
            echo "release_version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Get architecture suffix
        id: arch-suffix
        run: |
          if [[ "${{ matrix.platform }}" == "linux/amd64" ]]; then
            echo "suffix=amd64" >> $GITHUB_OUTPUT
          else
            echo "suffix=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source/${{ matrix.target.directory }}
          file: source/${{ matrix.target.directory }}/Dockerfile${{ matrix.target.variant == 'alpha' && '.alpha' || '' }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ inputs.no-cache == true }}
          build-args: |
            VERSION=${{ steps.set-version.outputs.release_version }}
          cache-from: type=gha,scope=${{ steps.image-name.outputs.image_name }}-${{ matrix.target.variant }}-${{ steps.arch-suffix.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ steps.image-name.outputs.image_name }}-${{ matrix.target.variant }}-${{ steps.arch-suffix.outputs.suffix }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }},push-by-digest=true,name-canonical=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.platform }},${{ steps.build.outputs.digest }}" >> /tmp/digests/digest-${{ steps.arch-suffix.outputs.suffix }}
          cat /tmp/digests/digest-${{ steps.arch-suffix.outputs.suffix }}

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.image-name.outputs.image_name }}-${{ matrix.target.variant }}-${{ steps.arch-suffix.outputs.suffix }}
          path: /tmp/digests/digest-${{ steps.arch-suffix.outputs.suffix }}
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.targets != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    outputs:
      release_version: ${{ steps.set-version.outputs.release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: source

      - name: Get image name from directory
        id: image-name
        run: |
          IMAGE_NAME=$(basename ${{ matrix.target.directory }})
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ steps.image-name.outputs.image_name }}-${{ matrix.target.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set VERSION environment variable
        id: set-version
        run: |
          VERSION_FILE="source/${{ matrix.target.directory }}/VERSION"
          if [ "${{ matrix.target.variant }}" = "alpha" ]; then VERSION_FILE="${VERSION_FILE}.alpha"; fi
          if [ -f "$VERSION_FILE" ]; then
            RELEASE_VERSION=$(cat "$VERSION_FILE" | tr -d ' \n\t\r')
            if [ -z "$RELEASE_VERSION" ] || { [ "${{ matrix.target.variant }}" = "alpha" ] && [ "$RELEASE_VERSION" = latest ]; }; then
              echo "Error: invalid version in $VERSION_FILE" >&2
              exit 1
            fi
            echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
            echo "Version set to: ${RELEASE_VERSION}"
          elif [ "${{ matrix.target.variant }}" = "alpha" ]; then
            echo "Error: VERSION.alpha is required for alpha builds" >&2
            exit 1
          else
            echo "No VERSION file found, using latest"
            echo "release_version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Check for newer changes
        id: current
        env:
          TARGET_DIRECTORY: ${{ matrix.target.directory }}
          TARGET_VARIANT: ${{ matrix.target.variant }}
        run: |
          git -C source fetch origin +refs/heads/master:refs/remotes/origin/master
          if [ "$TARGET_VARIANT" = alpha ]; then
            files=("$TARGET_DIRECTORY/Dockerfile.alpha" "$TARGET_DIRECTORY/VERSION.alpha" "$TARGET_DIRECTORY/entrypoint.sh")
          else
            files=("$TARGET_DIRECTORY/Dockerfile" "$TARGET_DIRECTORY/VERSION" "$TARGET_DIRECTORY/entrypoint.sh")
          fi
          if git -C source diff --quiet HEAD origin/master -- "${files[@]}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping publication: newer changes exist on master"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        if: steps.current.outputs.publish == 'true'
        working-directory: /tmp/digests
        run: |
          # Check if both digest files exist
          if [ ! -f "digest-amd64" ]; then
            echo "Error: AMD64 digest file not found"
            exit 1
          fi
          
          if [ ! -f "digest-arm64" ]; then
            echo "Error: ARM64 digest file not found"
            exit 1
          fi
          
          AMD64_DIGEST=$(cat digest-amd64 | cut -d ',' -f2)
          ARM64_DIGEST=$(cat digest-arm64 | cut -d ',' -f2)
          
          echo "AMD64 digest: ${AMD64_DIGEST}"
          echo "ARM64 digest: ${ARM64_DIGEST}"
          
          # Create manifest with version tag
          echo "Creating manifest with version tag: ${{ steps.set-version.outputs.release_version }}"
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}:${{ steps.set-version.outputs.release_version }} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}@${AMD64_DIGEST} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}@${ARM64_DIGEST}
          
          # Tag stable as latest and alpha as alpha.
          if [ "${{ matrix.target.variant }}" = "alpha" ]; then CHANNEL_TAG=alpha; else CHANNEL_TAG=latest; fi
          echo "Creating manifest with ${CHANNEL_TAG} tag"
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}:${CHANNEL_TAG} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}@${AMD64_DIGEST} \
            ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}@${ARM64_DIGEST}
          
          echo "Created and pushed manifest list for ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}"

  sync-images:
    needs: [prepare, merge]
    if: needs.prepare.outputs.targets != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      matrix:
        directory: ${{ fromJson(needs.prepare.outputs.directories) }}
    steps:
      - name: Get image name from directory
        id: image-name
        run: |
          IMAGE_NAME=$(basename ${{ matrix.directory }})
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
      - name: Install cosign
        uses: sigstore/cosign-installer@main

      - name: Install regctl
        uses: regclient/actions/regctl-installer@main

      - name: regctl login docker hub
        uses: regclient/actions/regctl-login@main
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: regctl login GitHub Container Registry
        uses: regclient/actions/regctl-login@main
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: sync images
        uses: it-bens/container-registry-sync-action@main
        with:
         sourceRepository: 'ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}'
         loginToSourceRepository: 'true'
         sourceRepositoryUsername: ${{ github.actor }}
         sourceRepositoryPassword: ${{ secrets.GITHUB_TOKEN }}
         targetRepository: '${{ github.repository_owner }}/${{ steps.image-name.outputs.image_name }}'
         loginToTargetRepository: 'true'
         targetRepositoryUsername: ${{ secrets.DOCKERHUB_USERNAME }}
         targetRepositoryPassword: ${{ secrets.DOCKERHUB_TOKEN }}